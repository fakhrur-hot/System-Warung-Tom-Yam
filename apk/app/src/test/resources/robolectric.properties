# Robolectric 4.13 ships Android images up to API 34, but the app targets 36, so it refuses to
# start with: "Package targetSdkVersion=36 > maxSdkVersion=34". Pinning the emulated SDK here
# applies to every Robolectric test rather than needing @Config(sdk = ...) on each class.
# Raise this (or drop the file) once Robolectric is upgraded to a version shipping API 36.
sdk=34

# Use a plain Application rather than the app's own PosApp. PosApp is @HiltAndroidApp and its
# onCreate() schedules BackupReminderWorker, which throws under test:
#   IllegalStateException: WorkManager is not initialized properly
# because WorkManagerInitializer is disabled in the manifest and nothing calls
# WorkManager#initialize in a unit-test JVM. These tests build Room directly and need neither Hilt
# nor WorkManager, so booting the real Application buys nothing and breaks every one of them.
# A test that DOES need Hilt should override this with @Config(application = ...) on the class.
application=android.app.Application
