# ─────────────────────────────────────────────────────────────────────────────
# The RAZStudio template repository — the one main branch every café is built from.
#
# This is deliberately NOT in apk/local.properties and NOT a Cloudflare env var.
# local.properties is per-machine and untracked, so it cannot answer "which repo is
# this?" — and the two things that need the answer (the APK and the provisioning
# Wizard) would then have to be configured separately and could disagree. A café's
# Pages site is created from this owner/repo, and the APK fetches its menu presets and
# affiliate catalog from the same place; if those ever pointed at different repos, a
# café would run a website from one source and a menu from another.
#
# So it lives here, committed on main, and both sides derive from it:
#   • apk/app/build.gradle.kts reads it into BuildConfig.RAZSTUDIO_GITHUB_OWNER / _REPO
#   • provisioning/scripts/generate-template-repo.mjs emits it into the Wizard's
#     functions/_generated/ at build time (same pattern as the migrations bundle)
#
# This is public information — the repo it names is the source these builds come from —
# so unlike a backend URL or an API key, baking it in leaks nothing. That is exactly why
# it may be baked while PROVISIONER_WORKER_URL may not.
#
# A fork or white-label changes these two values here, once, and both sides follow.
# ─────────────────────────────────────────────────────────────────────────────
RAZSTUDIO_GITHUB_OWNER=fakhrur-hot
RAZSTUDIO_GITHUB_REPO=System-Warung-Tom-Yam
