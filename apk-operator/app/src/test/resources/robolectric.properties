# Ported from apk/app's src/test/resources/robolectric.properties. Robolectric 4.13 ships Android
# images up to API 34, but this app targets 36, so it refuses to start with:
# "Package targetSdkVersion=36 > maxSdkVersion=34". Pinning the emulated SDK here applies to every
# Robolectric test rather than needing @Config(sdk = ...) on each class.
# Raise this (or drop the file) once Robolectric is upgraded to a version shipping API 36.
sdk=34

# Use a plain Application rather than this app's own OpsApp. OpsApp is @HiltAndroidApp and booting
# it needs Hilt's generated component set up, which a plain unit-test JVM doesn't provide. These
# tests exercise pure Kotlin objects (LinkGenerator, AffiliateProductFilter) and need neither Hilt
# nor WorkManager, so booting the real Application buys nothing and breaks every one of them.
application=android.app.Application
