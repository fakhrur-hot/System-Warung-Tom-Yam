# Deployment config for the Café Provisioning Wizard's OWN Cloudflare Pages project.
#
# Unlike website/wrangler.toml (per-café, git-ignored), this file describes ONE
# RAZStudio-operated tool used to onboard every café — safe and intended to be committed.
name = "cafe-setup-wizard"
compatibility_date = "2026-07-30"
# nodejs_compat is REQUIRED for /api/provision/schema.ts's direct-Postgres connection (the `pg`
# package's Cloudflare support depends on it) — per Cloudflare's own tutorial at
# developers.cloudflare.com/workers/tutorials/postgres/, confirmed 2026-07-30. Without this flag
# schema.ts's `import { Client } from "pg"` fails at request time, not build time.
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# The RAZStudio-owned repo Cloudflare git-integration deploys each café's website FROM is no longer
# configured here or as an env var. It is baked at build time from template-repo.properties at the
# monorepo root — the same file the APK compiles in — so the Wizard and the app cannot name different
# repositories. RAZSTUDIO_GITHUB_OWNER / RAZSTUDIO_GITHUB_REPO still override, for a fork.
#
# ⚠ DEPLOY THIS AS PAGES, NOT AS A WORKER.
#
# `pages_build_output_dir` above is what makes `npx wrangler pages deploy dist` correct. Deploying it
# with plain `wrangler deploy` puts the UI on *.workers.dev and serves dist/ only — Workers do not run
# a Pages `functions/` directory, so every /api/provision/* route 404s while the site itself looks
# perfectly healthy. A Wizard in that state cannot deploy Edge Functions, apply a schema or mint an
# owner key, and the failure gives no hint that the deployment target was the problem.
