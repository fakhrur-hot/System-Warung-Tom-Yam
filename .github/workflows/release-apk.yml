name: Release APK

# Build a signed release APK and attach it to a GitHub Release.
# Triggered by pushing a version tag (e.g. v0.1.0) or manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > warung-release.jks
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/warung-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: chmod +x ./gradlew
      - run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Clean up secrets
        if: always()
        run: rm -f warung-release.jks keystore.properties
