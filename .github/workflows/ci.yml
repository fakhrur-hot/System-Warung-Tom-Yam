name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Requirement 9 — the single-source property is not self-enforcing. One edit putting a real café's
  # name or domain back into shared source would undo the whole template effort silently, which is
  # how the fork happened the first time. Runs first and cheaply, so a violation is reported in
  # seconds rather than after a full Gradle build.
  no-cafe-literals:
    name: No café-specific literals in shared source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check shared source is café-agnostic
        run: node scripts/check-no-cafe-literals.mjs
      - name: Self-test the check (it must fail when it should)
        run: node scripts/check-no-cafe-literals.test.mjs

  website:
    name: Website (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  apk:
    name: APK (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      # ANDROID_SDK_ROOT is set by setup-android, so no local.properties is needed.
      - run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Unit tests. These were previously never run in CI at all — the job built the APK and linted
      # it, so a broken test could merge unnoticed. That is not hypothetical: task 1.4's tests were
      # once reported complete while all four of them failed, because only compilation had been
      # checked.
      #
      # Nothing extra is needed here. The unquoted -Djava.library.path that breaks test workers on
      # Windows is harmless on this runner, because Linux paths contain no spaces — and `gradlew`
      # only applies its remedy on Windows anyway. See the comment block in apk/gradlew for the
      # defect, the measurements, and why it cannot be fixed from the Test task or gradle.properties.
      - name: Unit tests
        working-directory: apk
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: apk/app/build/reports/tests/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Fails the job on any lint ERROR (abortOnError = true in app/build.gradle.kts) — the
      # ~179 pre-existing warnings don't fail it, only NEW errors introduced going forward.
      # NOTE: this is standard Android Lint, not Google's newer "Play Policy Insights" checks —
      # those currently only run interactively via Android Studio's own menu (Code → Inspect for
      # Play Policy Insights), with no Gradle/CLI entry point as of this writing, so they can't
      # be automated into CI yet. Real, CI-automatable Play Store/privacy-policy compliance
      # scanning is Google's separate "Checks" product (checks.google.com) — wiring in its
      # official GitHub Action (google-checks/checks-app-scan-github-action) needs a Checks
      # account + app registration + service-account credential this repo doesn't have yet.
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      - name: Upload lint report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: apk/app/build/reports/lint-results-debug.html
